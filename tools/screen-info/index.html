<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagnóstico de pantalla</title>
  <link rel="stylesheet" href="../../assets/css/01-tokens.css">
  <link rel="stylesheet" href="../../assets/css/02-base.css">
  <link rel="stylesheet" href="../../assets/css/03-layout.css">
  <link rel="stylesheet" href="../../assets/css/04-components/slide.css">
  <link rel="stylesheet" href="../../assets/css/05-utilities.css">
  <style>
    /* Herramienta aislada: estilos propios a propósito.
       La página se puede desplazar (área invisible de 300% x 300%) para medir
       qué eventos genera el "modo desplazamiento" del navegador de la TV. */
    /* height: auto hace que se desplace la ventana (window), no el body */
    html {
      height: auto;
      overflow: auto;
    }

    body {
      height: auto;
      overflow: visible;
    }

    /* Sin barras de desplazamiento visibles: no ocupan espacio ni distraen */
    ::-webkit-scrollbar {
      display: none;
    }

    .diagnostics {
      position: fixed;
      top: 0;
      left: 0;
    }

    .diagnostics__scroll-area {
      width: 300vw;
      height: 300vh;
    }

    .diagnostics__log {
      font-size: var(--font-size-ref);
      line-height: var(--line-height-text);
    }
  </style>
</head>
<body>
<main class="page diagnostics">
  <header class="slide__header u-mb-0">
    <h1 class="slide__title">Diagnóstico de pantalla</h1>
  </header>
  <p class="slide__note" id="screen-info"></p>
  <p class="diagnostics__log u-mt-l">Prueba: activa el modo desplazamiento (ícono de 4 flechas) y pulsa cada flecha <strong class="key">una sola vez</strong>, despacio.</p>
  <ol class="diagnostics__log" id="scroll-log">
    <li>Esperando…</li>
  </ol>
  <p class="slide__note" id="last-key">Tecla: ninguna todavía</p>
  <a class="slide__home-link is-focused" href="../../" id="home-link">Volver al inicio</a>
</main>
<div class="diagnostics__scroll-area" aria-hidden="true"></div>
<script>
  (function () {
    'use strict';

    // Tiempo sin eventos que da por terminada una pulsación.
    var GESTURE_IDLE_MS = 500;
    var MAX_LOG_LINES = 5;

    var RECENTER_TIMEOUT_MS = 1500;
    var CENTER_TOLERANCE = 2;

    var centerX = 0;
    var centerY = 0;
    var recentering = null;
    var gesture = null;
    var idleTimer = null;
    var logLines = [];

    function setText(id, text) {
      document.getElementById(id).textContent = text;
    }

    function renderInfo() {
      setText('screen-info',
        'Ventana ' + window.innerWidth + ' × ' + window.innerHeight +
        ' · DPR ' + window.devicePixelRatio +
        ' · Pantalla ' + screen.width + ' × ' + screen.height +
        ' · ' + navigator.userAgent);
    }

    function renderLog() {
      var list = document.getElementById('scroll-log');
      list.innerHTML = '';
      logLines.forEach(function (line) {
        var item = document.createElement('li');
        item.textContent = line;
        list.appendChild(item);
      });
    }

    function addLogLine(line) {
      logLines.unshift(line);
      if (logLines.length > MAX_LOG_LINES) {
        logLines.pop();
      }
      renderLog();
    }

    function distanceToCenter() {
      return Math.abs(window.pageXOffset - centerX) + Math.abs(window.pageYOffset - centerY);
    }

    // El regreso al centro también genera eventos (la TV lo anima). Se
    // cuentan aparte, para comprobar que no son una pulsación nueva.
    function centerScroll() {
      centerX = Math.round(window.innerWidth);
      centerY = Math.round(window.innerHeight);
      if (distanceToCenter() <= CENTER_TOLERANCE) {
        return;
      }
      var current = { start: Date.now(), events: 0 };
      recentering = current;
      window.scrollTo(centerX, centerY);
      // Si no llegan más eventos, no quedarse esperando para siempre.
      setTimeout(function () {
        if (recentering === current) {
          addLogLine('(regreso al centro: ' + current.events + ' eventos, sin terminar, ignorado)');
          recentering = null;
        }
      }, RECENTER_TIMEOUT_MS + 100);
    }

    function trackRecentering() {
      recentering.events += 1;
      var elapsed = Date.now() - recentering.start;
      if (distanceToCenter() <= CENTER_TOLERANCE || elapsed > RECENTER_TIMEOUT_MS) {
        addLogLine('(regreso al centro: ' + recentering.events + ' eventos, ' + elapsed + ' ms, ignorado)');
        recentering = null;
      }
    }

    function directionName(dx, dy) {
      if (Math.abs(dx) >= Math.abs(dy)) {
        return dx > 0 ? 'DERECHA →' : 'IZQUIERDA ←';
      }
      return dy > 0 ? 'ABAJO ↓' : 'ARRIBA ↑';
    }

    function finishGesture() {
      var dx = window.pageXOffset - centerX;
      var dy = window.pageYOffset - centerY;
      // Eventos sueltos sin movimiento real (llegan al terminar el regreso): ruido.
      if (Math.abs(dx) < CENTER_TOLERANCE && Math.abs(dy) < CENTER_TOLERANCE) {
        gesture = null;
        return;
      }
      addLogLine(directionName(dx, dy) +
        ': ' + gesture.scrollEvents + ' eventos scroll, ' +
        gesture.wheelEvents + ' wheel, dx=' + dx + ', dy=' + dy +
        ', ' + (Date.now() - gesture.start) + ' ms');
      gesture = null;
      centerScroll();
    }

    function trackEvent(kind) {
      if (!gesture) {
        gesture = { start: Date.now(), scrollEvents: 0, wheelEvents: 0 };
      }
      gesture[kind] += 1;
      clearTimeout(idleTimer);
      idleTimer = setTimeout(finishGesture, GESTURE_IDLE_MS);
    }

    window.addEventListener('scroll', function () {
      if (recentering) {
        trackRecentering();
      } else {
        trackEvent('scrollEvents');
      }
    });

    window.addEventListener('wheel', function () {
      trackEvent('wheelEvents');
    });

    document.addEventListener('keydown', function (event) {
      setText('last-key', 'Tecla: key=' + (event.key || '(vacío)') + ' · keyCode=' + event.keyCode);
    });

    window.addEventListener('resize', renderInfo);
    renderInfo();
    centerScroll();
    // Con el foco ya puesto, OK en el control vuelve a la portada.
    document.getElementById('home-link').focus({ preventScroll: true });
  })();
</script>
</body>
</html>
